name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          # Define environment variables for build
          export VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          export VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          export BASE_PATH="/${{ github.event.repository.name }}/"
          
          # Build from the app directory
          cd artifacts/turnocheck
          pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path to the build output
          path: './artifacts/turnocheck/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
